name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Parity and smoothness tests skip without the local model and
      # evaluation-only clips; the math tests always run.
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect the site
        run: |
          mkdir -p _site
          cp -r index.html inbetweener.html app src assets vendor LICENSE _site/
      # The 8-bit model is built from NVIDIA's FP32 file on deploy (never committed),
      # and cached until NVIDIA's repository or the build script changes.
      - name: Find NVIDIA's MotionBricks revision
        id: nvidia
        run: echo "rev=$(git ls-remote https://github.com/NVlabs/motionbricks HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore the built models
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ steps.nvidia.outputs.rev }}-${{ hashFiles('tools/build_int8.py', 'tools/build_body.py', 'assets/soma/skeleton.json') }}
      - uses: actions/setup-python@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - name: Build the 8-bit model and the SOMA body
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install onnx onnxruntime usd-core numpy
          python tools/build_int8.py --out models/int8
          python tools/build_body.py --out models/body
      - name: Add the built models to the site
        run: |
          mkdir -p _site/models
          cp -r models/int8 models/body _site/models/
      # Pages must be enabled once with Source "GitHub Actions"
      # (Settings > Pages); a workflow token cannot turn it on.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
